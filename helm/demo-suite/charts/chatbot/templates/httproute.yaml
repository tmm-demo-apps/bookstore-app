{{- if and .Values.enabled .Values.global.gatewayAPI.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: chatbot-route
  namespace: chatbot
  labels:
    {{- include "chatbot.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: demo-gateway
      namespace: bookstore
  hostnames:
    - {{ include "chatbot.ingressHost" . | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: chatbot-service
          port: 5000
{{- end }}
