# values-lab.yaml -- Configuration for the Hands-On Lab (Air-gapped)
#
# Usage:
#   helm install demo ./helm/demo-suite -f ./helm/demo-suite/values-lab.yaml
#
# Prerequisites:
#   kubectl create secret docker-registry harbor-registry-secret \
#     --docker-server=harbor-01a.vcf.lab \
#     --docker-username=YOUR_USER \
#     --docker-password=YOUR_PASSWORD \
#     -n bookstore

global:
  storageClassName: "vsan-default-storage-policy"
  domain: "vcf.lab"
  imagePullSecrets:
    - name: harbor-registry-secret

bookstore:
  image:
    repository: harbor-01a.vcf.lab/bookstore/app
    tag: latest
  replicas: 1
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  postgres:
    image: harbor-01a.vcf.lab/library/postgres:14-alpine
    storage: 5Gi
    resources:
      requests:
        memory: "256Mi"
        cpu: "150m"
      limits:
        memory: "768Mi"
        cpu: "500m"
  redis:
    image: harbor-01a.vcf.lab/library/redis:7-alpine
    storage: 2Gi
    resources:
      requests:
        memory: "128Mi"
        cpu: "50m"
      limits:
        memory: "256Mi"
        cpu: "250m"
  elasticsearch:
    enabled: false
  minio:
    image: harbor-01a.vcf.lab/library/minio/minio:latest
    storage: 10Gi
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"
        cpu: "500m"
  hpa:
    enabled: false

# Lab simplification: disable reader and chatbot
reader:
  enabled: false

chatbot:
  enabled: false
