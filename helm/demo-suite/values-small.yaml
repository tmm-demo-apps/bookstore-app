# values-small.yaml -- Lightweight profile for small/single-worker-node clusters
#
# Usage:
#   helm install demo ./helm/demo-suite \
#     -f ./helm/demo-suite/values-small.yaml \
#     --set global.domain=<your-domain> \
#     --set global.storageClassName=<your-storage-class>
#
# Sized for a 2-vCPU / 8GB worker node with ~830m CPU and ~4.2Gi memory
# available after system pods (VKS agent, antrea, csi, etc.).
#
# Total CPU requests:  ~600m  (leaves ~230m headroom)
# Total memory requests: ~1408Mi (leaves ~2.8Gi headroom)
# Elasticsearch disabled (search falls back to SQL)
# Gateway API enabled by default (same as values.yaml)

bookstore:
  replicas: 1
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  postgres:
    storage: 5Gi
    resources:
      requests:
        memory: "256Mi"
        cpu: "150m"
      limits:
        memory: "768Mi"
        cpu: "500m"
  redis:
    storage: 2Gi
    resources:
      requests:
        memory: "128Mi"
        cpu: "50m"
      limits:
        memory: "256Mi"
        cpu: "250m"
  elasticsearch:
    enabled: false
  minio:
    storage: 10Gi
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"
        cpu: "500m"
  hpa:
    enabled: false

reader:
  replicas: 1
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  postgres:
    storage: 2Gi
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"
        cpu: "500m"

chatbot:
  replicas: 1

# Legacy fallback -- only used when global.gatewayAPI.enabled is false
ingress-nginx:
  controller:
    replicaCount: 1
