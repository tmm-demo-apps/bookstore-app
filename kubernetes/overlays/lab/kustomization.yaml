apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: bookstore

resources:
  - ../../base

images:
  - name: harbor.corp.vmbeans.com/bookstore/app
    newName: harbor-01a.vcf.lab/bookstore/app
    newTag: latest
  - name: harbor.corp.vmbeans.com/library/postgres
    newName: harbor-01a.vcf.lab/library/postgres
  - name: harbor.corp.vmbeans.com/library/redis
    newName: harbor-01a.vcf.lab/library/redis
  - name: harbor.corp.vmbeans.com/library/elasticsearch
    newName: harbor-01a.vcf.lab/library/elasticsearch
  - name: harbor.corp.vmbeans.com/library/minio/minio
    newName: harbor-01a.vcf.lab/library/minio/minio

patches:
  - path: configmap-patch.yaml
  - path: httproute-patch.yaml
  - path: tls-patch.yaml
  - path: postgres-patch.yaml
  - path: elasticsearch-patch.yaml
  - path: redis-pvc-patch.yaml
  - path: minio-pvc-patch.yaml
