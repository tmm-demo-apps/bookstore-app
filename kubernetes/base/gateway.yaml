# Gateway resource for the Bookstore application
# Requires: Istio + Gateway API CRDs installed on the cluster
# The hostname-specific routing is handled by HTTPRoute (httproute.yaml)
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: demo-gateway
  annotations:
    cert-manager.io/cluster-issuer: demo-issuer
spec:
  gatewayClassName: istio
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: demo-tls
      allowedRoutes:
        namespaces:
          from: All
