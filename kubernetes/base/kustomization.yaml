apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Resources to include (order matters for dependencies)
resources:
  - namespace.yaml
  # Note: secret.yaml is gitignored - secrets are managed separately via:
  #   kubectl create secret generic app-secrets --from-literal=...
  #   kubectl create secret docker-registry harbor-registry-secret --docker-server=...
  # See kubernetes/README.md for secret creation commands
  - postgres.yaml
  - redis.yaml
  - elasticsearch.yaml
  - minio.yaml
  - migrations-configmap.yaml
  - app.yaml
  - gateway.yaml
  - httproute.yaml
  - tls.yaml
  - hpa.yaml
  # Note: init-db-job.yaml is a one-time job, apply separately after infrastructure is ready
  # Note: ingress-nginx.yaml deploys to ingress-nginx namespace, apply separately

# Image overrides - CI/CD updates the app tag only
# Tag format: vYYYYMMDD-shortsha (e.g., v20260116-bfb6ee9)
images:
  - name: harbor-01a.vcf.lab/bookstore/app
    newTag: v20260603-d26ec65
  - name: harbor-01a.vcf.lab/library/postgres
    newTag: 14-alpine
  - name: harbor-01a.vcf.lab/library/redis
    newTag: 7-alpine
  - name: harbor-01a.vcf.lab/library/elasticsearch
    newTag: 8.11.0
  - name: harbor-01a.vcf.lab/library/minio/minio
    newTag: latest

configMapGenerator:
  - name: app-config
    literals:
      - DB_HOST=postgres-service
      - DB_PORT=5432
      - DB_NAME=bookstore
      - REDIS_URL=redis-service:6379
      - ES_URL=http://elasticsearch-service:9200
      - MINIO_ENDPOINT=minio-service:9000
      - MINIO_USE_SSL=false
      - READER_BROWSER_URL=http://localhost:8081
      - CHATBOT_BROWSER_URL=http://localhost:5000
