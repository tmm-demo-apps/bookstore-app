{{template "base.html" .}}

{{define "title"}}Edit Profile{{end}}

{{define "content"}}
<style>
    .profile-edit-container {
        max-width: 600px;
        margin: 2rem auto;
        padding: 0 1rem;
    }
    
    .profile-edit-header {
        text-align: center;
        margin-bottom: 2rem;
    }
    
    .profile-edit-card {
        padding: 2rem;
        background: var(--card-sectionning-background-color);
        border-radius: var(--border-radius);
        border: 1px solid var(--muted-border-color);
    }
    
    .form-actions {
        display: flex;
        gap: 1rem;
        margin-top: 1.5rem;
    }
    
    .form-actions button,
    .form-actions a {
        flex: 1;
    }
    
    .alert {
        padding: 1rem;
        border-radius: var(--border-radius);
        margin-bottom: 1.5rem;
    }
    
    .alert-error {
        background: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
    }
    
    .form-help {
        font-size: 0.9rem;
        color: var(--muted-color);
        margin-top: 0.5rem;
    }
</style>

<div class="profile-edit-container">
    <div class="profile-edit-header">
        <h1><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:1.2rem;height:1.2rem;vertical-align:-2px;"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg> Edit Profile</h1>
        <p>Update your account information</p>
    </div>
    
    {{if .Error}}
    <div class="alert alert-error">
        {{.Error}}
    </div>
    {{end}}
    
    <div class="profile-edit-card">
        <form method="POST" action="/profile/update">
            <div>
                <label for="full_name">Full Name</label>
                <input type="text" 
                       id="full_name" 
                       name="full_name" 
                       value="{{if .User.FullName}}{{.User.FullName}}{{end}}"
                       placeholder="Enter your full name"
                       maxlength="255">
                <small class="form-help">This will be displayed on your reviews</small>
            </div>
            
            <div>
                <label for="email">Email Address *</label>
                <input type="email" 
                       id="email" 
                       name="email" 
                       value="{{.User.Email}}"
                       required
                       placeholder="your@email.com">
                <small class="form-help">Used for login and notifications</small>
            </div>
            
            <div class="form-actions">
                <button type="submit">Save Changes</button>
                <a href="/profile" role="button" class="secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{{end}}
